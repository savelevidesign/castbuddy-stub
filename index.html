<style>
/* Своя страница, а не документ: космонавт, звёздное поле и ряд ссылок.
   Типографику и цвета берём из legal/_style.css — тот же файл открывается,
   даже если приложение не загрузилось, и не тянет за собой сборку app.html. */
/* Страница не прокручивается вообще (правка владельца 08.08): содержимое
   помещается в экран и центрируется по вертикали, а не висит от верхнего края.
   overflow:hidden убирает саму прокрутку, overscroll-behavior:none — резиновый
   отскок от края на тачпаде: без него страница ездила вправо-влево и вверх-вниз,
   хотя прокручивать было нечего. 100dvh, а не 100vh, — на мобильных панель
   браузера меняет высоту, и на 100vh низ кнопок уходил бы под неё. */
/* 03.11 (владелец): тёмный космос. Свои значения поверх legal/_style.css —
   остальные официальные страницы остаются светлыми. color-scheme: dark в <head>
   — чтобы «авто-тёмная тема» Chrome не инвертировала страницу второй раз. */
:root{--bg:#111114;--ink:#F4F3EF;--ink-2:rgba(244,243,239,.66);--line:rgba(244,243,239,.22)}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
/* Шрифты сервиса (владелец 03.11): заголовок Unbounded 700, остальное Nunito Sans. */
body{font-family:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif}
.nf h1{font-family:'Unbounded','Nunito Sans',sans-serif;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
body .nf h1{margin-bottom:14px}
.nf p{font-weight:400}
body{background:var(--bg);color:var(--ink);min-height:100dvh;
  display:flex;align-items:center;justify-content:center}
.nf{position:relative;z-index:1;max-width:680px;margin:0 auto;
  padding:24px;text-align:center}
/* Картинка вертикальная (990×1087), поэтому ширину держим скромнее прежней:
   по высоте она и так забирает больше места, чем прежний квадратный кадр. */
.nf-art{position:relative;width:250px;max-width:56vw;aspect-ratio:990.6/1087;margin:0 auto 22px}
/* 03.11 (владелец): маскот парит отдельно от звёзд и планет. Два движения с
   разным периодом — вверх-вниз и лёгкий крен, — поэтому качание не повторяется
   как маятник и выглядит невесомым. Двигаем только transform. */
.nf-art img{position:absolute;inset:0;width:100%;height:100%;display:block}
.nf-float{position:absolute;inset:0;animation:nfFloat 6s ease-in-out infinite}
/* Планета (владелец 03.11): светлая и объёмная — градиент и тень по краю шара;
   без кратеров (владелец 03.11); ось плавно гуляет, а кольцо
   «дышит» — наклон виден то сильнее, то слабее. Задняя половина кольца — за
   шаром (за шаром лежит всё кольцо целиком, чтобы на стыке половин не было линии разреза), передняя — перед ним. Только transform, разные периоды — без маятника. */
.nf-planet{position:absolute;left:-2.5%;top:-3%;width:36%;aspect-ratio:1}
.nf-planet svg{display:block;width:100%;height:100%;overflow:visible}
/* Шар и кольца — на одной оси (владелец 03.11): центр общий. Два кольца
   (владелец 03.11): сплошная лента и снаружи пояс из точек в несколько рядов —
   все ряды крутятся с одной скоростью, как пояс камней вокруг планеты. Наклон (12 с) и раскрытие колец (6 с) идут в
   отношении 1:2 — путь края замыкается плавной восьмёркой, шар поворачивается
   навстречу наклону. Ленты — круги в сплющенной группе: ни одного стыка;
   передняя половина рисуется поверх полной задней, цвета непрозрачные. */
.pl-ball{transform-origin:60px 60px;animation:plBall 12s ease-in-out infinite}
.pl-axis{transform-origin:60px 60px;transform:rotate(-15deg);animation:plTilt 12s ease-in-out -3s infinite}
.pl-ring{transform-origin:60px 60px;animation:plRing 6s ease-in-out infinite}
.pl-bands circle{fill:none}
.pl-d{fill:none;stroke:#fff;stroke-linecap:round;vector-effect:non-scaling-stroke;transform-origin:60px 60px;animation:plSpin 40s linear infinite}
@keyframes plSpin{to{transform:rotate(360deg)}}
@keyframes plTilt{0%,100%{transform:rotate(-27deg)}50%{transform:rotate(-3deg)}}
@keyframes plBall{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-12deg)}}
@keyframes plRing{0%,100%{transform:scale(1,.86)}50%{transform:scale(1,1.12)}}
.nf-sway{position:absolute;inset:0;animation:nfSway 9s ease-in-out infinite;transform-origin:50% 55%}
/* Огонь ранца (владелец 03.11): живой, белый, без обводки, один язык пламени
   (второй, мелкий, владелец снял 03.11) — дрожит медленно и мягко.
   Лежит под маскотом: верх пламени прячется в сопле ранца. */
.nf-fire{position:absolute;left:14.5%;top:59.8%;width:8.4%;height:10.5%;
  transform-origin:50% 0;transform:rotate(34deg)}
.nf-fire b{position:absolute;inset:0;transform-origin:50% 0;
  animation:nfFlick 1.3s ease-in-out infinite}
.nf-fire svg{display:block;width:100%;height:100%;fill:#fff;overflow:visible}
@keyframes nfFlick{
  0%,100%{transform:scale(1,1) skewX(0)}
  20%{transform:scale(.97,1.06) skewX(2deg)}
  45%{transform:scale(1.03,.94) skewX(-2.5deg)}
  70%{transform:scale(.98,1.08) skewX(1.5deg)}
  85%{transform:scale(1.02,.97) skewX(-1deg)}
}
@keyframes nfFloat{0%,100%{transform:translateY(-8px)}50%{transform:translateY(8px)}}
@keyframes nfSway{0%,100%{transform:rotate(-1.6deg)}50%{transform:rotate(1.6deg)}}
/* Звёзды с рисунка — на тех же местах и того же размера, но живые: мерцают,
   как звёзды фона, и не парят вместе с маскотом. */
.nf-art i{position:absolute;display:block;aspect-ratio:1;color:#fff;
  animation:nfTwinkle 3.4s ease-in-out infinite}
.nf-art i svg{display:block;width:100%;height:100%;fill:currentColor}
.nf h1{font-size:34px;margin:0 0 6px}
/* Подзаголовок — вторая строка заголовка по смыслу: продолжает фразу «И целой
   вселенной мало..», поэтому стоит вплотную и набран тише, но крупнее текста. */
.nf-sub{font-size:20px;line-height:1.35;color:var(--ink-2);margin:0 0 36px}
/* Уже прежнего и с переносом по смыслу (владелец 03.11): первое слово новой
   фразы не висит в конце строки — оно привязано к следующему неразрывным пробелом. */
.nf p{margin:0 auto 28px;max-width:38ch;text-wrap:pretty}
/* Каждая фраза — с новой строки: начало следующей не повисает в конце прежней. */
.nf p.nf-lines{max-width:none}
.nf-lines span{display:block;text-wrap:balance}
/* Две кнопки столбиком по центру (правка владельца 08.08). Ширина задана числом,
   а не содержимым: у «На главную» и «Помощь» разной длины подписи, а столбик
   с кнопками разной ширины читается как список ссылок, а не как выбор из двух.
   218px: 140px — прежняя ширина самой широкой, плюс треть, плюс ещё пятая
   часть сверху (вторая правка владельца 08.08). */
.nf-links{display:flex;flex-direction:column;align-items:center;gap:12px}
/* Ключевая — фиолетовая пилюля, вторая тихая с тонкой обводкой. */
.nf-links a{width:218px;box-sizing:border-box;text-align:center;
  padding:12px 22px;border-radius:999px;font-size:16px;font-weight:700;
  text-decoration:none;border:1px solid var(--line);color:var(--ink);
  position:relative;
  transition:background-color .35s ease,color .35s ease,border-color .35s ease}
.nf-links a:hover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nf-links a.is-key{background:var(--accent);border-color:var(--accent);color:#fff}
.nf-links a.is-key:hover{background:#5B53F0;border-color:#5B53F0}
/* Свечение — отдельным слоем: тень не анимируем, меняем только его прозрачность. */
.nf-links a.is-key::after{content:'';position:absolute;inset:0;border-radius:inherit;z-index:-1;
  box-shadow:0 0 26px 2px rgba(91,83,240,.55);opacity:.65;transition:opacity .35s ease;pointer-events:none}
.nf-links a.is-key:hover::after{opacity:1}

/* Звёздное поле. Звезда — тот же значок ✦, которым в сервисе обозначаются сцены:
   на странице про потерянную ссылку он читается и как звезда, и как «наши сцены
   где-то там». С 03.11 фон тёмный, звёзды белые, а фигура — та же, что
   на рисунке маскота.
   Прозрачности нет (правка владельца 08.08): все звёзды в полный цвет текста,
   мерцание осталось только размером. Раньше оно шло и по прозрачности — звёзды
   выцветали до .16 и половину времени были едва различимы.
   Размах мерцания широкий (вторая правка 08.08): 0.7 → 1.9. Узкий диапазон на
   непрозрачных звёздах в глаза не бросался — движение было, но его не замечали.
   Разброс самих кеглей тоже широкий, от 7 до 22 px: поле из звёзд одного
   размера читается как узор, а не как небо.
   Каждая со своей задержкой, иначе поле пульсировало бы разом, как гирлянда. */
/* Под текстом и кнопками звёзд нет (правка владельца 08.08). Прячет их скрипт
   внизу страницы: он знает, где стоит блок с содержимым, а CSS — нет, ширина
   блока ограничена max-width и в процентах не выражается.
   По умолчанию звезда скрыта и показывается скриптом: если он почему-то не
   отработает, лучше чистый фон, чем звёзды поверх текста. */
.nf-stars{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.nf-stars i{position:absolute;display:block;font-style:normal;line-height:1;
  font-size:13px;color:#fff;visibility:hidden;
  animation:nfTwinkle 3.4s ease-in-out infinite}
.nf-stars i.on{visibility:visible}
/* На телефоне — свой набор звёзд, реже и ровнее по полю (владелец 03.11):
   компьютерная раскладка на узком экране сбивалась в кучки. */
.nf-stars i.m{display:none}
.nf-stars i svg{display:block;width:1em;height:1em;fill:currentColor}
@keyframes nfTwinkle{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.6)}
}
@media (prefers-reduced-motion:reduce){ .nf-stars i,.nf-art i,.nf-float,.nf-sway,.nf-fire b,.pl-ball,.pl-d,.pl-axis,.pl-ring{animation:none} }
/* На узком экране подзаголовок тоже поджимаем: рядом с h1 в 27px он в прежних
   20px переставал читаться как второй уровень. */
@media (max-width:600px){
  .nf{padding:18px} .nf h1{font-size:27px}
  /* На телефоне фразы по строкам давали рваный столбик (владелец 03.11) —
     здесь текст идёт одним ровным абзацем, а начало фразы привязано к
     следующему слову неразрывным пробелом и одно в конце строки не висит. */
  .nf p.nf-lines{max-width:34ch;text-wrap:balance}
  .nf-lines span{display:inline}
  .nf-stars i{display:none} .nf-stars i.m{display:block}
  .nf-sub{font-size:17px;margin-bottom:28px}
}
/* Прокрутки нет, значит содержимое обязано влезать в любую высоту — иначе
   overflow:hidden просто срежет кнопки. Поджимаем по высоте окна, начиная с
   картинки: она забирает больше всех. */
@media (max-height:720px){
  .nf-art{width:190px;margin-bottom:16px}
  .nf h1{font-size:28px} .nf-sub{font-size:17px;margin-bottom:24px}
  .nf p{margin-bottom:20px}
}
@media (max-height:580px){
  .nf-art{width:120px}
  .nf h1{font-size:23px} .nf-sub{font-size:15px;margin-bottom:16px}
  .nf p{font-size:15px;margin-bottom:16px}
  .nf-links{gap:8px}
  .nf-links a{padding:10px 22px}
}
</style>
</head>

    <p class="nf-lines"><span>У нашего хостинг‑провайдера крупный сбой.</span> <span>Делаем&nbsp;всё возможное для восстановления CastBuddy.</span> <span>Все&nbsp;новости оперативно напишем в&nbsp;Telegram-канале.</span></p>

<script>
/* Показываем только те звёзды, что не налезают на текст и кнопки.
   Прямоугольник содержимого CSS не знает: ширина блока ограничена max-width, в
   процентах её не выразить, а на узком экране блок занимает почти всё поле.
   Поэтому решение принимает скрипт — и пересчитывает его при смене размера окна
   и при повороте экрана. Запас в 14 px, чтобы звезда не липла к букве. */
(function(){
  var box = document.querySelector('.nf'),
      stars = document.querySelectorAll('.nf-stars i'),
      GAP = 14, timer;

  function place(){
    // Сверяем не с блоком целиком (на телефоне он во всю ширину и прятал почти
    // все звёзды), а с тем, что в нём реально нарисовано: картинка, кнопки и
    // каждая строка текста отдельно.
    var rs = [];
    box.querySelectorAll('.nf-art,.nf-links a').forEach(function(e){ rs.push(e.getBoundingClientRect()); });
    box.querySelectorAll('h1,p').forEach(function(e){
      var rg = document.createRange(); rg.selectNodeContents(e);
      var lr = rg.getClientRects();
      for (var k = 0; k < lr.length; k++) rs.push(lr[k]);
    });
    for (var i = 0; i < stars.length; i++){
      var s = stars[i];
      // Мерцание раздувает звезду до 1.6 — меряем по самому большому её размеру,
      // иначе мелкая звезда у края текста в пике касалась бы буквы.
      s.classList.add('on');
      var r = s.getBoundingClientRect(),
          w = r.width * 1.6 / 2, h = r.height * 1.6 / 2,
          cx = r.left + r.width / 2, cy = r.top + r.height / 2,
          hit = rs.some(function(b){
            return cx + w > b.left - GAP && cx - w < b.right + GAP
                && cy + h > b.top - GAP && cy - h < b.bottom + GAP;
          });
      if (hit) s.classList.remove('on');
    }
  }

  place();
  // Шрифт заголовка догружается позже и меняет ширину текста (03.11: звезда
  // легла на «недоступен») — пересчитываем, когда шрифты и картинки готовы.
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
  addEventListener('load', place);
  addEventListener('resize', function(){
    clearTimeout(timer); timer = setTimeout(place, 120);
  });
})();
</script>
